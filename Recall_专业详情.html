<style>
.page{max-width:860px;margin:24px auto 50px;padding:0 18px}
/* 面包屑 */
.crumb{font-size:12.5px;color:var(--sub);margin-bottom:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--main);text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* 头部卡片 */
.detail-hero{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:24px 26px;box-shadow:0 8px 28px rgba(30,41,59,.05);margin-bottom:18px
}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dh-title{font-size:23px;font-weight:700;color:var(--ink);margin:0}
.dh-sub{font-size:13px;color:var(--sub);margin-top:8px}
.dh-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
.tag-blue{background:#EDF5FC;color:var(--main)}
.tag-orange{background:#FFF3E2;color:#E08A1E}
.tag-green{background:#EEFAF0;color:#2DA44E}
.tag-gray{background:#F1F5F9;color:#64748B}
.tag-red{background:#FFF1F1;color:#E25555}
.dh-actions{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.btn-s{
  padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--main),#7FA8F5);color:#fff;border:none;
  box-shadow:0 6px 18px rgba(91,141,239,.28);transition:.18s;white-space:nowrap
}
.btn-s:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(91,141,239,.38)}
.btn-o{
  padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;
  background:#F6FAFD;color:var(--main);border:1.5px solid var(--line);transition:.15s;white-space:nowrap
}
.btn-o:hover{background:#EDF5FC;border-color:var(--sec)}

/* 信息条 */
.factbar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.fact{background:#FAFCFF;border:1px solid #E6EEF6;border-radius:14px;padding:14px 16px}
.fact .fk{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.fact .fv{font-size:15px;font-weight:700;color:var(--ink)}
.fact .fv small{font-size:11px;font-weight:500;color:var(--sub)}

/* 区块 */
.section{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:22px 24px;margin-bottom:16px;box-shadow:0 6px 22px rgba(30,41,59,.04)
}
.section h3{font-size:16px;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section h3 .ic{font-size:18px}
.sec-body{font-size:13.5px;line-height:1.85;color:#334155}
.sec-body p{margin:0 0 10px}
.sec-body p:last-child{margin-bottom:0}
.sec-body b{color:var(--ink)}

/* 课程 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip-c{background:#F6FAFD;color:var(--main);border:1px solid #E1ECF8;
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500}

/* 学费强调 */
.fee-box{
  background:linear-gradient(135deg,#FFF8EE,#FFF3E2);border:1px solid #FFE3BE;
  border-radius:14px;padding:16px 18px;margin-top:4px
}
.fee-big{font-size:26px;font-weight:800;color:#E08A1E;line-height:1.1}
.fee-note{font-size:11.5px;color:#B27A1F;margin-top:8px;line-height:1.6}

/* 前景评估条 */
.bars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .bl{width:78px;font-size:12.5px;color:var(--sub);flex-shrink:0}
.bar-track{flex:1;height:9px;background:#EEF3F8;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(135deg,var(--main),#7FA8F5)}
.bar-row .bv{width:42px;text-align:right;font-size:13px;font-weight:700;color:var(--ink)}

/* 适配度 */
.fit-pill{display:inline-flex;align-items:center;gap:6px;background:#EEFAF0;color:#2DA44E;
  padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700}

@media(max-width:640px){
  .factbar{grid-template-columns:1fr}
  .dh-actions{flex-direction:row;width:100%}
  .dh-actions .btn-s,.dh-actions .btn-o{flex:1}
}
</style>
</head>

<script>
/* ========== 参数读取 ========== */
const params = new URLSearchParams(location.search);
const SCHOOL = params.get('school') || '未知院校';
const MAJOR = params.get('major') || '专业';
const SCORE = params.get('score') || null;

/* ========== 院校类型 → 学费档位 ========== */

const HEBAN = ['香港中文大学（深圳）','香港科技大学（广州）','深圳北理莫斯科大学','北师浸会','广东以色列理工学院'];

function schoolType(name){
  if(HEBAN.some(s=>name.includes(s))) return 'heban';
  if(MINBAN.some(s=>name.includes(s))) return 'minban';
  return 'gongban';
}

/* ========== 专业分类 ========== */
function detectCategory(n){
  n = String(n).replace(/（[^（）]*）/g,'').replace(/\([^()]*\)/g,'').trim();
  if(/临床|口腔|麻醉|医学影像|医学检验|预防医学|护理|中医|针灸|中西医|儿科学|基础医学|法医|康复|眼视光|助产|医学实验|卫生检验|精神医学|智能医学|医学技术|康复治疗/.test(n)) return '医学';
  if(/药学|制药|药物|生物制药|中药|中草药|化妆品科学|化妆品技术/.test(n)) return '药学';
  if(/计算机|软件|网络工程|物联网|数据科学|大数据|人工智能|智能科学|网络空间|信息安全|区块链|信息对抗|数字媒体技术|密码|虚拟现实/.test(n)) return '计算机';
  if(/电子|通信|光电|信息工程|集成电路|微电子|电气|自动化|机械|土木|材料|化工|化学工程|环境|交通|车辆|能源|测绘|水利|地质|船舶|航海|轮机|港口|建筑|城乡|风景园林|安全|测控|仪器|工程力学|遥感|生物医学|生物工程|食品|纺织|石油|刑事科学|物证|智能制造|机器人|工程造价|工业工程|航空航天|核工程|智能建造|给排水|采矿|冶金|智能感知|工科|试验班|储能|光源|包装工程|微机电|无人驾驶|航空器|木材|汽车服务|油气储运|消防工程|焊接|环保设备|资源勘查|资源循环|过程装备|道路桥梁|数字印刷|印刷/.test(n)) return '工学';
  if(/数学|物理|化学|统计|生物科学|应用物理|应用化学|心理学|地理|生态|大气|海洋|天文|力学|地球|系统科学|生物技术|生物信息|信息与计算科学|量子|应用气象|数理基础|数据计算/.test(n)) return '理学';
  if(/师范|教育|学前|小学|思政|思想政治|科学教育|特殊教育|汉语国际|体育教育|马克思主义/.test(n)) return '教育';
  if(/汉语言|汉语|文学|新闻|传播|广告|播音|编导|英语|俄语|日语|法语|德语|西班牙语|翻译|社会学|历史|哲学|语言学|网络与新媒体|广播电视|文化遗产|文物保护|秘书|意大利语|朝鲜语|葡萄牙语|档案|文物/.test(n)) return '人文';
  if(/法学|法律|知识产权|监狱|信用|公安|侦查|治安|警务|司法|国际事务|社会工作|国际政治|政治学|国际法|国际经贸规则|禁毒|警犬/.test(n)) return '法学';
  if(/经济|金融|国贸|国际商务|财政|税收|保险|投资|会计|财务|工商|市场|人力资源|物流|管理|电子商务|旅游|行政|公共|工程管理|信息管理与信息系统|审计|资产评估|文化产业|信用管理|劳动与社会保障|精算/.test(n)) return '经管';
  if(/设计|美术|音乐|舞蹈|雕塑|绘画|摄影|书法|艺术|视觉|环境设计|产品|服装|表演|动画|数媒艺术|艺术与科技|戏剧|作曲|中国画/.test(n)) return '艺术';
  if(/体育|运动|武术|休闲|社会体育|运动人体|运动训练/.test(n)) return '体育';

/* ========== 学费计算 ========== */
function feeInfo(type, cat){
  // 艺术 / 医学类公办学费更高
  const premium = (cat==='艺术' || cat==='医学' || cat==='药学');
  if(type==='heban') return {min:95000, max:120000, label:'中外合办 / 特殊类'};
  if(type==='minban'){
    if(cat==='艺术') return {min:35000, max:55000, label:'民办本科'};
    return {min:28000, max:49800, label:'民办本科'};
  }
  // 公办
  if(cat==='艺术') return {min:10000, max:15000, label:'公办本科'};
  if(premium) return {min:6960, max:10000, label:'公办本科（医学/药学类）'};
  return {min:6060, max:8000, label:'公办本科'};
}

/* ========== 交互 ========== */
function askAIAbout(){
  const q = `请结合我的画像，详细分析「${SCHOOL} · ${MAJOR}」这个专业：它的课程难度、数学要求、就业前景，以及是否适合我？用因为…所以…说明理由。`;
  try{ localStorage.setItem('recall_prefill', q); }catch(e){}
  location.href = 'Recall_AI答疑.html';
}
function saveMajor(){
  let favs = [];
  try{ favs = JSON.parse(localStorage.getItem('recall_fav_majors')||'[]'); }catch(e){}
  const key = SCHOOL+' / '+MAJOR;
  if(favs.includes(key)){ showToast('已收藏过该专业'); return; }
  favs.push(key);
  try{ localStorage.setItem('recall_fav_majors', JSON.stringify(favs)); }catch(e){}
  showToast('⭐ 已收藏：'+key);
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%)translateY(-100px);background:linear-gradient(135deg,var(--main),#7FA8F5);color:#fff;padding:12px 24px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(91,141,239,.4);z-index:200;transition:.3s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.transform='translateX(-50%)translateY(0)';
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.style.transform='translateX(-50%)translateY(-100px)',2200);
}

/* file:// 警告 */
if(location.protocol==='file:'){ document.getElementById('fileWarn').style.display='block'; }

/* 帮助浮层 */
function showHelpTip(el){
  const tip=document.getElementById('helpTip');
  if(!tip) return;
  tip.style.display=tip.style.display!=='none'?'none':'block';
  if(tip.style.display==='block'){ setTimeout(()=>{ document.addEventListener('click',function h(e){ if(e.target.closest('#helpTip')||e.target.classList.contains('help-float')) return; tip.style.display='none'; document.removeEventListener('click',h); }); },10); }
}
